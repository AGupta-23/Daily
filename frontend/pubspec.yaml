name: daily
description: AI-powered voice-first productivity app for people with ADHD
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── HTTP & API ────────────────────────────────────────────
  dio: ^5.4.0
  connectivity_plus: ^5.0.2      # NEW: detect online/offline for queue logic

  # ── JSON Serialization ────────────────────────────────────
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # ── Audio Recording ───────────────────────────────────────
  record: ^6.2.0
  record_linux: ^1.3.0
  path_provider: ^2.1.2
  permission_handler: ^11.2.0

  # ── Audio Playback (Phase 4 voice notes) ──────────────────
  just_audio: ^0.9.36            # NEW: playback with seek + speed control
  audio_session: ^0.1.18         # NEW: manage audio focus properly

  # ── Text-to-Speech (Phase 3 verbal reminders) ─────────────
  flutter_tts: ^3.8.5            # NEW: speak reminder text aloud

  # ── Notifications (Phase 3) ───────────────────────────────
  flutter_local_notifications: ^17.1.2   # NEW: schedule local notifications
  timezone: ^0.9.4                        # NEW: required for scheduled notifs

  # ── UI & Icons ────────────────────────────────────────────
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  table_calendar: ^3.0.9
  intl: ^0.19.0
  flutter_slidable: ^3.1.0       # NEW: swipe actions on list items

  # ── Local Storage ─────────────────────────────────────────
  shared_preferences: ^2.2.2

  # ── Utilities ─────────────────────────────────────────────
  equatable: ^2.0.5
  logger: ^2.0.2+1
  uuid: ^4.3.3                   # NEW: generate IDs for offline queued tasks

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  riverpod_generator: ^2.3.11

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/